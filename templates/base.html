{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

   <title>    
        {% block title %}
          Home - Page
        {% endblock title %}
  </title>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">QR Attendance</a>
    {% if user.is_authenticated %}

      <span class="text-white">{{ user.username }}</span>
      <form method="post" action="{% url 'Users_app:logout' %}">
        {% csrf_token %}
        <button  class="btn btn-sm btn-outline-light">Logout</button>
      </form>
      
      <a href="{%  url 'attendance_app:scan_page' %}" class="nav-link">Scan</a>

    {% else%}
       
       <ul class="navbar-nav">
        <li class="nav-item d-flex"><a href="{%  url 'Users_app:register' %}" class="nav-link text-white">Sign Up</a></li>
        <li class="nav-item d-flex"><a href="{%  url 'Users_app:login' %}" class="nav-link text-white">Login</a></li>
       </ul>  

    {% endif %}
  </div>
</nav>
<div class="container">

  {% block content %}
  

  {% endblock content %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
