{% extends 'base.html'%}

{% load crispy_forms_tags %}

{% block title %}
   Login - Page
{% endblock title %}

{% block content %}


<div class="container ">
 <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow bottom-up">
                <div class="card-body py-4">
                     <h3 class="card-title text-center bg-dark text-white mb-1 p-4 fw-bold">Login</h3><hr>
                     <form method="post">
                      {% csrf_token %}
                      <div class="mb-3">
                        <label for="username" class="form-label mt-2 fw-bold"></label>
                        <input type="text" class="form-control" placeholder="Enter username or email" name="username">
                      </div>
                      <div class="mb-3">
                        <label for="password" class="form-label fw-bold"></label>
                        <input type="password" class="form-control" placeholder="Enter password" name="password">
                      </div>
                      <button type="submit" class="btn btn-primary btn-lg  w-100 mt-3">Sign in</button>
                    </form>
                   <div class="mt-3 lead">You don't have an account? <a href="{% url 'Users_app:register' %}"> SignUp</a> here</div>
                 
                </div>
            </div>
        </div>
    </div>
  <footer class="mt-5 text-white-50 text-center  bottom-0 start-0  z-0">
        <p>
          @All right reserved &copy; UDUS 2026
        </p>
  </footer>
</div>
{% endblock content %}
