{% extends 'base.html'%}

{% load crispy_forms_tags %}

{% block title %}
   Login - Page
{% endblock title %}

{% block content %}


<div class="container ">
 <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow bottom-up">
                <div class="card-body py-4">
                     <h3 class="card-title text-center bg-dark text-white mb-1 p-4 fw-bold">Login</h3><hr>
                     <form method="post">
                       {% csrf_token %}
                      <div class="mb-3">
                        <label for="username" class="form-label mt-2">Username</label>
                        <input type="text" class="form-control" name="username">
                      </div>
                      <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password">
                      </div>
          
                      <button type="submit" class="btn btn-primary btn-lg  w-100 mt-3">Sign in</button>
                    </form>
                <div class="mt-3">You don't have an account? <a href="{% url 'Users_app:register' %}"> SignUp</a> here</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
